<!doctype html>
<!--
  Base template for slides.elijahfrost.com. Agent orientation:
  format contract → /_framework/v1/DECK-FORMAT.md
  slide vocabulary → /_framework/v1/SLIDE-TYPES.md

  Edit everything outside the FRAMEWORK-MANAGED fences. Fill in deck-meta
  (slug, title, description, tags, date, slide_types_used). Add sections
  inside <deck-stage>; keep speaker-notes length equal to non-skipped
  sections. Leave version_id / parent_version_id / created_at / updated_at
  alone — the server stamps them on upload.
-->
<html lang="en">
<head>
<!-- FRAMEWORK-MANAGED:head-pin — do not edit -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="/_framework/v1/tokens.css">
<link rel="stylesheet" href="/_framework/v1/slide-types.css">
<!-- /FRAMEWORK-MANAGED:head-pin -->

<title>Untitled deck</title>
<meta name="description" content="A slide deck.">

<script type="application/json" id="deck-meta">{
  "schema": "deck/1",
  "framework": "v1",
  "slug": "untitled",
  "kind": "deck",
  "parent_template": "blank-deck",
  "title": "Untitled deck",
  "description": "A slide deck.",
  "tags": [],
  "date": null,
  "version_id": null,
  "parent_version_id": null,
  "created_at": null,
  "updated_at": null,
  "slide_types_used": ["slide-title"],
  "agent": { "model": "", "session": "" }
}</script>

<style id="piece-style">
  /* Piece-specific CSS — animations, color accents, custom slide-types.
     Loads after slide-types.css so rules here win the cascade. */
  deck-stage:not(:defined) { visibility: hidden; }
</style>
</head>
<body>

<deck-stage width="1920" height="1080" data-slide-types="slide-title">
  <section class="slide-title" data-numeral="I" data-name="Title">
    <div class="slide center">
      <h1 class="display hero-name">Untitled deck</h1>
      <p class="sub">Subtitle.</p>
    </div>
  </section>
</deck-stage>

<script type="application/json" id="speaker-notes">[""]</script>

<!-- FRAMEWORK-MANAGED:deck-bootstrap — do not edit -->
<script src="/_framework/v1/deck-stage.js"></script>
<!-- /FRAMEWORK-MANAGED:deck-bootstrap -->

<script id="piece-script">
  /* Piece-specific JS — listen for slidechange, drive motion. */
</script>

</body>
</html>
