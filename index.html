<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides — Elijah Frost</title>
<meta name="description" content="A catalog of slide pieces by Elijah Frost.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://slides.elijahfrost.com/">
<meta property="og:title" content="Slides — Elijah Frost">
<meta property="og:description" content="A catalog of slide pieces by Elijah Frost.">
<meta property="og:image" content="https://slides.elijahfrost.com/og-image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Slides — Elijah Frost">
<meta name="twitter:description" content="A catalog of slide pieces by Elijah Frost.">
<meta name="twitter:image" content="https://slides.elijahfrost.com/og-image.png">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="/_framework/v1/tokens.css">
<link rel="stylesheet" href="/hub.css">
</head>
<body>

<main class="hub">

  <header class="hub-header">
    <div class="hub-header-text">
      <h1 class="hub-title">Slides</h1>
      <p class="hub-eyebrow">Elijah Frost</p>
    </div>
    <nav class="hub-header-actions" aria-label="Deck actions">
      <a class="hub-action" href="/upload/">Upload</a>
    </nav>
  </header>

  <nav class="hub-tabs" role="tablist" aria-label="Catalog">
    <button class="hub-tab" role="tab" data-tab="decks" aria-selected="true">Decks</button>
    <button class="hub-tab" role="tab" data-tab="templates" aria-selected="false">Templates</button>
  </nav>

  <div class="hub-search-wrap">
    <input id="search" class="hub-search" type="search"
           placeholder="Search pieces" aria-label="Search pieces"
           autocomplete="off" spellcheck="false">
  </div>

  <section id="catalog" class="hub-catalog" aria-live="polite"></section>

</main>

<template id="card-template">
  <article class="hub-card-row">
    <a class="hub-card">
      <h2 class="hub-card-title"></h2>
      <p class="hub-card-description"></p>
      <p class="hub-card-meta">
        <span class="hub-card-date"></span>
        <span class="hub-card-tags"></span>
      </p>
    </a>
    <a class="hub-card-download" title="Download .html to edit with an agent" aria-label="Download to edit">⇣</a>
  </article>
</template>

<script>
(async () => {
  const catalogEl = document.getElementById('catalog');
  const searchEl  = document.getElementById('search');
  const tpl       = document.getElementById('card-template');
  const tabsEl    = document.querySelector('.hub-tabs');

  // Load catalog (decks + user-uploaded templates) and the seed-template
  // manifest in parallel. Both lists are merged into the templates tab;
  // the decks tab only shows catalog pieces with kind === "deck".
  let pieces = [];
  let seedTemplates = [];
  try {
    const [cat, seeds] = await Promise.all([
      fetch('/catalog.json', { cache: 'no-store' }).then(r => r.json()),
      fetch('/_framework/v1/templates/index.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : { templates: [] })
        .catch(() => ({ templates: [] })),
    ]);
    pieces = (cat.pieces || []).slice().sort((a, b) =>
      (b.date || '').localeCompare(a.date || '')
    );
    seedTemplates = seeds.templates || [];
  } catch (err) {
    catalogEl.textContent = 'Could not load catalog.';
    return;
  }

  // Active tab + URL sync. ?tab=templates deep-links to that view; the
  // /templates/ route rewrites to the same hub with that query.
  const initial = new URLSearchParams(location.search).get('tab') === 'templates'
    ? 'templates' : 'decks';
  let activeTab = initial;
  setActiveTab(activeTab, /* skipUrl */ true);

  tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    setActiveTab(btn.dataset.tab);
  });

  function setActiveTab(name, skipUrl) {
    activeTab = name;
    tabsEl.querySelectorAll('[data-tab]').forEach((b) => {
      const on = b.dataset.tab === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (!skipUrl) {
      const u = new URL(location.href);
      if (name === 'templates') u.searchParams.set('tab', 'templates');
      else u.searchParams.delete('tab');
      history.replaceState(null, '', u);
    }
    render(searchEl.value);
  }

  function entries() {
    if (activeTab === 'templates') {
      // User-uploaded templates (catalog kind:"template") + seed templates.
      const userTpls = pieces
        .filter(p => p.kind === 'template')
        .map(p => ({ ...p, _seed: false }));
      const seeds = seedTemplates.map(t => ({
        slug: t.name,
        title: t.title,
        description: t.description || '',
        date: '',
        tags: t.tags || [],
        _seed: true,
      }));
      return userTpls.concat(seeds);
    }
    // Decks tab — anything not explicitly a template (kind unset or "deck").
    return pieces.filter(p => (p.kind || 'deck') === 'deck');
  }

  function render(query) {
    catalogEl.innerHTML = '';
    const q = (query || '').trim().toLowerCase();
    const all = entries();
    const matched = q
      ? all.filter(p => {
          const hay = [p.title, p.description, ...(p.tags || [])]
            .filter(Boolean).join(' ').toLowerCase();
          return hay.includes(q);
        })
      : all;

    if (matched.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'hub-empty';
      empty.textContent = activeTab === 'templates'
        ? 'No templates yet. Upload one or convert a deck.'
        : 'No decks matched.';
      catalogEl.appendChild(empty);
      return;
    }

    for (const p of matched) {
      const node = tpl.content.cloneNode(true);
      const a = node.querySelector('.hub-card');
      const dl = node.querySelector('.hub-card-download');
      if (p._seed) {
        // Seed templates download as a fresh file; no /slug/ page.
        a.href = '/api/export-template?name=' + encodeURIComponent(p.slug);
        a.setAttribute('download', '');
        dl.remove();
      } else {
        a.href = '/' + p.slug + '/';
        dl.href = '/api/export-piece?slug=' + encodeURIComponent(p.slug);
      }
      node.querySelector('.hub-card-title').textContent = p.title;
      const desc = node.querySelector('.hub-card-description');
      if (p.description) desc.textContent = p.description; else desc.remove();
      node.querySelector('.hub-card-date').textContent = p.date || '';
      node.querySelector('.hub-card-tags').textContent =
        (p.tags || []).join(' · ');
      catalogEl.appendChild(node);
    }
  }

  render('');
  searchEl.addEventListener('input', e => render(e.target.value));
})();
</script>

</body>
</html>
