<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides — Elijah Frost</title>
<meta name="description" content="A catalog of slide pieces by Elijah Frost.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://slides.elijahfrost.com/">
<meta property="og:title" content="Slides — Elijah Frost">
<meta property="og:description" content="A catalog of slide pieces by Elijah Frost.">
<meta property="og:image" content="https://slides.elijahfrost.com/og-image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Slides — Elijah Frost">
<meta name="twitter:description" content="A catalog of slide pieces by Elijah Frost.">
<meta name="twitter:image" content="https://slides.elijahfrost.com/og-image.png">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="/_framework/v1/tokens.css">
<link rel="stylesheet" href="/hub.css">
</head>
<body>

<main class="hub">

  <header class="hub-header">
    <div class="hub-header-text">
      <h1 class="hub-title">Slides</h1>
      <p class="hub-eyebrow">Elijah Frost</p>
    </div>
    <nav class="hub-header-actions" aria-label="Deck actions">
      <a class="hub-action" href="/upload/">Upload</a>
    </nav>
  </header>

  <div class="hub-layout">

    <div class="hub-main">

      <nav class="hub-tabs" role="tablist" aria-label="Catalog">
        <button class="hub-tab" role="tab" data-tab="decks" aria-selected="true">Decks</button>
        <button class="hub-tab" role="tab" data-tab="templates" aria-selected="false">Templates</button>
      </nav>

      <div class="hub-search-wrap">
        <input id="search" class="hub-search" type="search"
               placeholder="Search pieces" aria-label="Search pieces"
               autocomplete="off" spellcheck="false">
      </div>

      <section id="catalog" class="hub-catalog" aria-live="polite"></section>

    </div>

    <aside class="hub-pinned" aria-label="Pinned items">
      <h2 class="hub-pinned-head">Pinned</h2>
      <div class="hub-pinned-group" data-group="templates">
        <p class="hub-pinned-label">Templates</p>
        <ul class="hub-pinned-list" id="pinned-templates"></ul>
      </div>
      <div class="hub-pinned-group" data-group="decks">
        <p class="hub-pinned-label">Decks</p>
        <ul class="hub-pinned-list" id="pinned-decks"></ul>
      </div>
      <p class="hub-pinned-empty" id="pinned-empty" hidden>Nothing pinned yet.</p>
    </aside>

  </div>

</main>

<template id="card-template">
  <article class="hub-card-row">
    <a class="hub-card">
      <h2 class="hub-card-title"></h2>
      <p class="hub-card-description"></p>
      <p class="hub-card-meta">
        <span class="hub-card-date"></span>
        <span class="hub-card-tags"></span>
      </p>
    </a>
    <div class="hub-card-actions">
      <button class="hub-card-action hub-card-pin" type="button"
              title="Pin to sidebar" aria-label="Pin to sidebar"
              aria-pressed="false">★</button>
      <button class="hub-card-action hub-card-reclassify" type="button"
              title="Reclassify" aria-label="Reclassify">↻</button>
      <a class="hub-card-action hub-card-download"
         title="Download .html to edit with an agent"
         aria-label="Download to edit">⇣</a>
      <button class="hub-card-action hub-card-delete" type="button"
              title="Delete" aria-label="Delete">×</button>
    </div>
  </article>
</template>

<template id="pinned-template">
  <li class="hub-pinned-item">
    <a class="hub-pinned-link"></a>
    <button class="hub-pinned-unpin" type="button"
            title="Unpin" aria-label="Unpin">×</button>
  </li>
</template>

<script>
(async () => {
  const catalogEl       = document.getElementById('catalog');
  const searchEl        = document.getElementById('search');
  const tpl             = document.getElementById('card-template');
  const pinnedTpl       = document.getElementById('pinned-template');
  const tabsEl          = document.querySelector('.hub-tabs');
  const pinnedTplListEl = document.getElementById('pinned-templates');
  const pinnedDeckListEl= document.getElementById('pinned-decks');
  const pinnedEmptyEl   = document.getElementById('pinned-empty');

  // Load catalog (decks + user-uploaded templates) and the seed-template
  // manifest in parallel. Both lists are merged into the templates tab;
  // the decks tab only shows catalog pieces with kind === "deck". Seed
  // templates can also be flagged pinned in their manifest.
  let pieces = [];
  let seedTemplates = [];
  try {
    const [cat, seeds] = await Promise.all([
      fetch('/api/catalog/', { cache: 'no-store' }).then(r => r.json()),
      fetch('/_framework/v1/templates/index.json', { cache: 'no-store' })
        .then(r => r.ok ? r.json() : { templates: [] })
        .catch(() => ({ templates: [] })),
    ]);
    pieces = (cat.pieces || []).slice().sort((a, b) =>
      (b.date || '').localeCompare(a.date || '')
    );
    seedTemplates = seeds.templates || [];
  } catch (err) {
    catalogEl.textContent = 'Could not load catalog.';
    return;
  }

  // Active tab + URL sync. ?tab=templates deep-links to that view; the
  // /templates/ route rewrites to the same hub with that query.
  const initial = new URLSearchParams(location.search).get('tab') === 'templates'
    ? 'templates' : 'decks';
  let activeTab = initial;
  setActiveTab(activeTab, /* skipUrl */ true);

  tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    setActiveTab(btn.dataset.tab);
  });

  function setActiveTab(name, skipUrl) {
    activeTab = name;
    tabsEl.querySelectorAll('[data-tab]').forEach((b) => {
      const on = b.dataset.tab === name;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (!skipUrl) {
      const u = new URL(location.href);
      if (name === 'templates') u.searchParams.set('tab', 'templates');
      else u.searchParams.delete('tab');
      history.replaceState(null, '', u);
    }
    render(searchEl.value);
  }

  function entries() {
    if (activeTab === 'templates') {
      // User-uploaded templates (catalog kind:"template") + seed templates.
      const userTpls = pieces
        .filter(p => p.kind === 'template')
        .map(p => ({ ...p, _seed: false }));
      const seeds = seedTemplates.map(t => ({
        slug: t.name,
        title: t.title,
        description: t.description || '',
        date: '',
        tags: t.tags || [],
        pinned: !!t.pinned,
        _seed: true,
      }));
      return userTpls.concat(seeds);
    }
    // Decks tab — anything not explicitly a template (kind unset or "deck").
    return pieces.filter(p => (p.kind || 'deck') === 'deck');
  }

  function render(query) {
    renderPinned();
    catalogEl.innerHTML = '';
    const q = (query || '').trim().toLowerCase();
    const all = entries();
    const matched = q
      ? all.filter(p => {
          const hay = [p.title, p.description, ...(p.tags || [])]
            .filter(Boolean).join(' ').toLowerCase();
          return hay.includes(q);
        })
      : all;

    if (matched.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'hub-empty';
      empty.textContent = activeTab === 'templates'
        ? 'No templates yet. Upload one.'
        : 'No decks matched.';
      catalogEl.appendChild(empty);
      return;
    }

    for (const p of matched) {
      const node = tpl.content.cloneNode(true);
      const row = node.querySelector('.hub-card-row');
      const a  = node.querySelector('.hub-card');
      const dl = node.querySelector('.hub-card-download');
      const pin = node.querySelector('.hub-card-pin');
      const rc  = node.querySelector('.hub-card-reclassify');
      const del = node.querySelector('.hub-card-delete');

      row.dataset.slug = p.slug;
      row.dataset.kind = p._seed ? 'template' : (p.kind || 'deck');
      if (p.pinned) row.dataset.pinned = '';

      if (p._seed) {
        // Seed templates download as a fresh file; no /slug/ page, and
        // they can't be reclassified, unpinned, or deleted from the hub
        // (they're canonical, owned by the framework).
        a.href = '/api/export-template?name=' + encodeURIComponent(p.slug);
        a.setAttribute('download', '');
        dl.remove();
        pin.remove();
        rc.remove();
        del.remove();
      } else {
        a.href = '/' + p.slug + '/';
        dl.href = '/api/export-piece?slug=' + encodeURIComponent(p.slug);
        pin.setAttribute('aria-pressed', p.pinned ? 'true' : 'false');
        pin.title = p.pinned ? 'Unpin from sidebar' : 'Pin to sidebar';
        pin.setAttribute('aria-label', pin.title);
        const otherKind = (p.kind || 'deck') === 'deck' ? 'template' : 'deck';
        rc.title = 'Convert to ' + otherKind;
        rc.setAttribute('aria-label', rc.title);
        rc.dataset.to = otherKind;
      }

      node.querySelector('.hub-card-title').textContent = p.title;
      const desc = node.querySelector('.hub-card-description');
      if (p.description) desc.textContent = p.description; else desc.remove();
      node.querySelector('.hub-card-date').textContent = p.date || '';
      node.querySelector('.hub-card-tags').textContent =
        (p.tags || []).join(' · ');
      catalogEl.appendChild(node);
    }
  }

  function renderPinned() {
    pinnedTplListEl.innerHTML = '';
    pinnedDeckListEl.innerHTML = '';

    const pinnedSeeds = seedTemplates
      .filter(t => t.pinned)
      .map(t => ({
        slug: t.name,
        title: t.title,
        kind: 'template',
        _seed: true,
        href: '/api/export-template?name=' + encodeURIComponent(t.name),
        download: true,
      }));
    const pinnedUserTpls = pieces
      .filter(p => p.pinned && p.kind === 'template')
      .map(p => ({
        slug: p.slug, title: p.title, kind: 'template', _seed: false,
        href: '/api/export-piece?slug=' + encodeURIComponent(p.slug),
        download: true,
      }));
    const pinnedDecks = pieces
      .filter(p => p.pinned && (p.kind || 'deck') === 'deck')
      .map(p => ({
        slug: p.slug, title: p.title, kind: 'deck', _seed: false,
        href: '/' + p.slug + '/',
        download: false,
      }));

    const tpls = pinnedSeeds.concat(pinnedUserTpls);
    for (const item of tpls) appendPinned(pinnedTplListEl, item);
    for (const item of pinnedDecks) appendPinned(pinnedDeckListEl, item);

    const empty = tpls.length === 0 && pinnedDecks.length === 0;
    pinnedEmptyEl.hidden = !empty;
    pinnedTplListEl.parentElement.hidden = tpls.length === 0;
    pinnedDeckListEl.parentElement.hidden = pinnedDecks.length === 0;
  }

  function appendPinned(listEl, item) {
    const node = pinnedTpl.content.cloneNode(true);
    const link = node.querySelector('.hub-pinned-link');
    const unpin = node.querySelector('.hub-pinned-unpin');
    link.href = item.href;
    link.textContent = item.title;
    if (item.download) link.setAttribute('download', '');
    if (item._seed) {
      // Seed pins are canonical; no unpin control.
      unpin.remove();
    } else {
      unpin.dataset.slug = item.slug;
    }
    listEl.appendChild(node);
  }

  // ----- mutations -----
  catalogEl.addEventListener('click', async (e) => {
    const pinBtn = e.target.closest('.hub-card-pin');
    const rcBtn  = e.target.closest('.hub-card-reclassify');
    const delBtn = e.target.closest('.hub-card-delete');
    if (!pinBtn && !rcBtn && !delBtn) return;
    e.preventDefault();
    const row = e.target.closest('.hub-card-row');
    const slug = row?.dataset.slug;
    if (!slug) return;

    if (pinBtn) {
      const next = pinBtn.getAttribute('aria-pressed') !== 'true';
      await applyMutation(row, { slug, pinned: next });
    } else if (rcBtn) {
      const to = rcBtn.dataset.to;
      await applyMutation(row, { slug, kind: to });
    } else if (delBtn) {
      const title = row.querySelector('.hub-card-title')?.textContent || slug;
      if (!confirm(`Delete "${title}"? This can't be undone.`)) return;
      await applyDelete(row, slug);
    }
  });

  document.querySelector('.hub-pinned').addEventListener('click', async (e) => {
    const btn = e.target.closest('.hub-pinned-unpin');
    if (!btn) return;
    e.preventDefault();
    const slug = btn.dataset.slug;
    if (!slug) return;
    await applyMutation(null, { slug, pinned: false });
  });

  async function applyDelete(row, slug) {
    if (row) row.dataset.busy = '';
    try {
      const res = await fetch('/api/item-delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        alert('Delete failed: ' + (data.message || res.status));
        return;
      }
      pieces = pieces.filter(p => p.slug !== slug);
      render(searchEl.value);
    } catch (err) {
      alert('Network error: ' + err.message);
    } finally {
      if (row) delete row.dataset.busy;
    }
  }

  async function applyMutation(row, body) {
    if (row) row.dataset.busy = '';
    try {
      const res = await fetch('/api/item-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        alert('Update failed: ' + (data.message || res.status));
        return;
      }
      // Patch local catalog and re-render.
      const idx = pieces.findIndex(p => p.slug === data.slug);
      if (idx >= 0) {
        pieces[idx] = { ...pieces[idx], kind: data.kind, pinned: !!data.pinned };
      }
      render(searchEl.value);
    } catch (err) {
      alert('Network error: ' + err.message);
    } finally {
      if (row) delete row.dataset.busy;
    }
  }

  render('');
  searchEl.addEventListener('input', e => render(e.target.value));
})();
</script>

</body>
</html>
