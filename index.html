<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides — Elijah Frost</title>
<meta name="description" content="A catalog of slide pieces by Elijah Frost.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://slides.elijahfrost.com/">
<meta property="og:title" content="Slides — Elijah Frost">
<meta property="og:description" content="A catalog of slide pieces by Elijah Frost.">
<meta property="og:image" content="https://slides.elijahfrost.com/og-image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Slides — Elijah Frost">
<meta name="twitter:description" content="A catalog of slide pieces by Elijah Frost.">
<meta name="twitter:image" content="https://slides.elijahfrost.com/og-image.png">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="/_framework/v1/tokens.css">
<link rel="stylesheet" href="/_framework/v1/ef-scope.css">
<link rel="stylesheet" href="/hub.css">
<script src="/_framework/v1/ef-scope.js" defer></script>
</head>
<body>

<main class="hub">

  <header class="hub-header">
    <div class="hub-header-text">
      <h1 class="hub-title">Slides</h1>
      <p class="hub-eyebrow">Elijah Frost</p>
    </div>
    <nav class="hub-header-actions" aria-label="Deck actions">
      <a class="hub-action" href="/upload/" data-requires-scope="write">Upload</a>
    </nav>
  </header>

  <div class="hub-layout">

    <div class="hub-main">

      <nav class="hub-tabs" role="tablist" aria-label="Catalog">
        <button class="hub-tab" role="tab" data-tab="decks" aria-selected="true">Decks</button>
        <button class="hub-tab" role="tab" data-tab="templates" aria-selected="false">Templates</button>
        <button class="hub-tab" role="tab" data-tab="trash" aria-selected="false">Trash <span class="hub-tab-count" id="trash-count" hidden></span></button>
      </nav>

      <div class="hub-search-wrap">
        <input id="search" class="hub-search" type="search"
               placeholder="Search pieces" aria-label="Search pieces"
               autocomplete="off" spellcheck="false">
      </div>

      <div class="hub-bulk" id="bulk-bar" hidden>
        <span class="hub-bulk-count"><span id="bulk-count">0</span> selected</span>
        <div class="hub-bulk-actions" id="bulk-actions"></div>
        <button class="hub-bulk-clear" type="button" data-bulk="clear">Clear</button>
      </div>

      <section id="catalog" class="hub-catalog" aria-live="polite"></section>

    </div>

    <aside class="hub-pinned" aria-label="Pinned items">
      <h2 class="hub-pinned-head">Pinned</h2>
      <div class="hub-pinned-group" data-group="templates">
        <p class="hub-pinned-label">Templates</p>
        <ul class="hub-pinned-list" id="pinned-templates"></ul>
      </div>
      <div class="hub-pinned-group" data-group="decks">
        <p class="hub-pinned-label">Decks</p>
        <ul class="hub-pinned-list" id="pinned-decks"></ul>
      </div>
      <p class="hub-pinned-empty" id="pinned-empty" hidden>Nothing pinned yet.</p>
    </aside>

  </div>

</main>

<template id="card-template">
  <article class="hub-card-row">
    <input type="checkbox" class="hub-card-select" aria-label="Select piece">
    <a class="hub-card">
      <h2 class="hub-card-title">
        <span class="hub-card-source" hidden></span>
        <span class="hub-card-title-text"></span>
      </h2>
      <p class="hub-card-description"></p>
      <p class="hub-card-meta">
        <span class="hub-card-date"></span>
        <span class="hub-card-tags"></span>
        <span class="hub-card-parent" hidden></span>
      </p>
    </a>
    <div class="hub-card-actions">
      <button class="hub-card-action hub-card-pin" type="button"
              data-requires-scope="write"
              title="Pin to sidebar" aria-label="Pin to sidebar"
              aria-pressed="false">★</button>
      <button class="hub-card-action hub-card-reclassify" type="button"
              data-requires-scope="write"
              title="Reclassify" aria-label="Reclassify">↻</button>
      <button class="hub-card-action hub-card-rename" type="button"
              data-requires-scope="write"
              title="Rename" aria-label="Rename">✎</button>
      <a class="hub-card-action hub-card-download"
         title="Download .html to edit with an agent"
         aria-label="Download to edit">⇣</a>
      <button class="hub-card-action hub-card-delete" type="button"
              data-requires-scope="write"
              title="Move to trash" aria-label="Move to trash">×</button>
    </div>
  </article>
</template>

<template id="trash-template">
  <article class="hub-card-row hub-card-row-trash">
    <input type="checkbox" class="hub-card-select" aria-label="Select piece">
    <a class="hub-card">
      <h2 class="hub-card-title">
        <span class="hub-card-source" hidden></span>
        <span class="hub-card-title-text"></span>
      </h2>
      <p class="hub-card-description"></p>
      <p class="hub-card-meta">
        <span class="hub-card-deleted"></span>
        <span class="hub-card-tags"></span>
      </p>
    </a>
    <div class="hub-card-actions">
      <button class="hub-card-action hub-card-restore" type="button"
              data-requires-scope="write"
              title="Restore" aria-label="Restore">↶</button>
      <button class="hub-card-action hub-card-purge" type="button"
              data-requires-scope="write"
              title="Delete permanently" aria-label="Delete permanently">⌫</button>
    </div>
  </article>
</template>

<template id="pinned-template">
  <li class="hub-pinned-item">
    <a class="hub-pinned-link"></a>
    <button class="hub-pinned-unpin" type="button"
            data-requires-scope="write"
            title="Unpin" aria-label="Unpin">×</button>
  </li>
</template>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="true"></div>

<div id="modal-overlay" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 class="modal-title" id="modal-title">Confirm</h3>
    <p class="modal-body" id="modal-body"></p>
    <div class="modal-input-wrap" id="modal-input-wrap" hidden>
      <input id="modal-input" type="text" class="modal-input" autocomplete="off">
      <p class="modal-input-hint" id="modal-input-hint"></p>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" type="button" id="modal-cancel">Cancel</button>
      <button class="modal-confirm" type="button" id="modal-confirm">OK</button>
    </div>
  </div>
</div>

<script src="/hub.js"></script>

</body>
</html>
